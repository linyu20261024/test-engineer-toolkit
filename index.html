<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>个人工作资源中心</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#182230;--muted:#667085;--line:#e5e9f0;--accent:#315efb;--accent2:#eaf0ff;--danger:#d92d20;--green:#16845b;--shadow:0 8px 28px rgba(16,24,40,.06);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent);text-decoration:none}
.app{min-height:100vh;display:flex}.sidebar{width:230px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 24px}.brand-icon{width:38px;height:38px;border-radius:12px;background:var(--accent);color:white;display:grid;place-items:center;font-size:20px}.brand h1{font-size:15px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.nav-label{color:#98a2b3;font-size:11px;font-weight:700;padding:10px 10px 6px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#475467;display:flex;align-items:center;gap:10px}.nav button:hover{background:#f5f7fb}.nav button.active{background:var(--accent2);color:var(--accent);font-weight:650}.nav .ico{width:20px;text-align:center;font-size:17px}.sidebar-bottom{margin-top:auto;padding:12px 8px 0;color:var(--muted);font-size:11px}
.main{flex:1;min-width:0;padding:24px 28px 40px;max-width:1600px;margin:0 auto;width:100%}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.mobile-brand{display:none}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover{border-color:#b7c5ff}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--danger)}.btn.small{padding:6px 9px;font-size:12px}.icon-btn{width:36px;height:36px;padding:0}
.page-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.page-title h2{font-size:24px;margin:0 0 5px}.page-title p{margin:0;color:var(--muted)}.search-wrap{display:flex;gap:8px;margin-bottom:20px}.search-wrap input{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;outline:none}.search-wrap input:focus,input:focus,select:focus,textarea:focus{border-color:#8098ff;box-shadow:0 0 0 3px rgba(49,94,251,.1)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.stat .label{color:var(--muted);font-size:12px}.stat .num{font-size:25px;font-weight:750;margin-top:4px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.section-head h3{font-size:16px;margin:0}.section-head span{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;box-shadow:0 2px 5px rgba(16,24,40,.015)}.card:hover{box-shadow:var(--shadow);border-color:#d5dcf0}.card-top{display:flex;gap:10px;align-items:flex-start}.card-icon{width:40px;height:40px;border-radius:12px;background:#f0f3ff;display:grid;place-items:center;font-size:19px;flex-shrink:0}.card-title{font-size:14px;font-weight:700;margin:1px 0 3px;overflow-wrap:anywhere}.card-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.card-desc{margin:12px 0;color:#475467;white-space:pre-wrap;overflow-wrap:anywhere}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.tag{background:#f2f4f7;color:#475467;padding:3px 7px;border-radius:6px;font-size:11px}.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.card-actions .btn{font-size:12px;padding:6px 9px}.card-tools{margin-left:auto;display:flex;gap:4px}.star{border:0;background:transparent;color:#98a2b3;font-size:19px;padding:0 3px}.star.on{color:#eaaa08}.empty{background:#fff;border:1px dashed #cfd5df;border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filters input,.filters select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;max-width:100%}.view-toggle{display:flex;gap:4px;background:#eef1f6;padding:3px;border-radius:10px}.view-toggle button{border:0;border-radius:7px;padding:6px 9px;background:transparent;color:var(--muted)}.view-toggle button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px #0001}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{padding:12px 14px;text-align:left;border-bottom:1px solid #eef0f4;vertical-align:top}.data-table th{font-size:12px;color:var(--muted);background:#fafbfc;font-weight:650}.data-table tr:last-child td{border-bottom:0}.data-table td:first-child{font-weight:650}.data-table .muted{color:var(--muted);font-weight:400;font-size:12px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-size:12px}.pager-controls{display:flex;gap:6px}
.modal-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 70px #0002}.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}.modal-head h3{margin:0;font-size:17px}.modal-body{padding:20px 22px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#475467;font-weight:650}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px 11px;min-width:0;width:100%;outline:none;background:#fff}.field textarea{min-height:92px;resize:vertical}.hint{font-size:11px;color:var(--muted);font-weight:400}.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#182230;color:white;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:40;display:none;max-width:90vw}.toast.show{display:block}
.mobile-nav{display:none}.notice{border:1px solid #dbe5ff;background:#f5f8ff;border-radius:12px;padding:12px 14px;color:#344054;font-size:12px;margin:12px 0 18px}.notice strong{color:#2348d8}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f7f8fa;border:1px solid #e6e8ec;padding:10px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:22px 20px 36px}.sidebar{width:210px}}
@media(max-width:720px){.app{display:block}.sidebar{display:none}.main{padding:15px 14px calc(88px + env(safe-area-inset-bottom));}.topbar{margin-bottom:18px}.mobile-brand{display:flex;align-items:center;gap:8px;font-weight:750}.mobile-brand .brand-icon{width:32px;height:32px;font-size:16px}.top-actions .btn{padding:8px 9px;font-size:12px}.top-actions .hide-mobile{display:none}.page-title{margin-bottom:14px}.page-title h2{font-size:21px}.page-title p{font-size:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:18px}.stat{padding:12px}.stat .num{font-size:22px}.cards{grid-template-columns:1fr;gap:9px}.card{padding:14px}.search-wrap{gap:6px}.search-wrap input{padding:12px}.search-wrap .btn{padding:10px}.section-head{margin-top:20px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1;width:100%}.filters select{width:100%}.form-grid{grid-template-columns:1fr;gap:12px}.field.full{grid-column:auto}.modal-backdrop{padding:0;align-items:flex-end}.modal{width:100%;max-height:94vh;border-radius:18px 18px 0 0}.modal-body{padding:17px}.modal-head,.modal-foot{padding:15px 17px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:2px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}.mobile-nav button{border:0;background:transparent;color:#667085;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;min-width:0;flex:1;padding:3px 0}.mobile-nav button .ico{font-size:18px}.mobile-nav button.active{color:var(--accent);font-weight:700}.pager{align-items:flex-start;flex-direction:column}.table-wrap{border-radius:10px}.data-table{min-width:700px}.notice{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-icon">⌘</div><div><h1>个人工作资源中心</h1><small>测试工程师工作坊</small></div></div>
  <div class="nav-label">资源导航</div>
  <nav class="nav" id="sideNav"></nav>
  <div class="nav-label">管理</div>
  <nav class="nav" id="sideManage"></nav>
  <div class="sidebar-bottom">本地优先 · 自动保存<br>数据保存在当前浏览器中</div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="mobile-brand"><div class="brand-icon">⌘</div><span>个人工作资源中心</span></div>
    <div style="flex:1"></div>
    <div class="top-actions">
      <button class="btn hide-mobile" id="quickAdd">＋ 新增资源</button>
      <button class="btn" id="dataManage">⇅ 数据管理</button>
    </div>
  </header>
  <div id="content"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
 <div class="modal">
  <div class="modal-head"><h3 id="modalTitle">新增资源</h3><button class="btn icon-btn" id="closeModal" aria-label="关闭">✕</button></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-foot" id="modalFoot"></div>
 </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,.csv,.xlsx,.xls" hidden>
<script>
const DB_NAME='workResourceCenterDB', DB_VERSION=1, STORE='resources', SETTINGS_KEY='wrc_settings_v1';
const sections=[
 {id:'accounts',name:'账号与环境',icon:'🔐',desc:'测试环境、系统入口、账号标识与配置说明',kind:'account'},
 {id:'files',name:'文件资源',icon:'📁',desc:'本地文件路径、测试资料、脚本和目录',kind:'file'},
 {id:'tools',name:'工作工具',icon:'🧰',desc:'测试工具、操作命令、常用指令和工具入口',kind:'tool'},
 {id:'knowledge',name:'业务知识',icon:'📚',desc:'业务规则、操作手册、测试经验与问题分析',kind:'knowledge'},
 {id:'platforms',name:'工作平台',icon:'🌐',desc:'测试平台、缺陷管理与项目系统入口',kind:'platform'},
 {id:'templates',name:'模板中心',icon:'📋',desc:'测试用例、测试报告及常用工作模板',kind:'template'},
 {id:'home',name:'工作首页',icon:'🏠',desc:'常用资源、最近访问与快捷入口',kind:'home'}
];
let db=null, resources=[], settings={view:'card',pageSize:20}, currentSection='home', currentPage=1, currentView='card', searchTerm='', activeFilter='all', editId=null;
const $=s=>document.querySelector(s);
function uid(){return 'r_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function splitTags(s){return Array.isArray(s)?s:String(s||'').split(/[,，;；]/).map(x=>x.trim()).filter(Boolean)}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE)){const st=d.createObjectStore(STORE,{keyPath:'id'});st.createIndex('section','section',{unique:false});st.createIndex('updatedAt','updatedAt',{unique:false})}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function loadAll(){const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).getAll();const rows=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result||[]);req.onerror=()=>rej(req.error)});resources=rows.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''))}
async function saveResource(item){const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);await txDone(tx);await loadAll()}
async function deleteResource(id){const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);await txDone(tx);await loadAll()}
function getSection(id){return sections.find(s=>s.id===id)||sections[0]}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function persistSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch(e){}}
function loadSettings(){try{settings={...settings,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch(e){} currentView=settings.view||'card'}
function navButton(s,extra=''){return `<button data-nav="${s.id}" class="${currentSection===s.id?'active':''}"><span class="ico">${s.icon}</span><span>${s.name}</span></button>`}
function renderNav(){ $('#sideNav').innerHTML=sections.map(s=>navButton(s)).join('')+`<button data-nav="favorites" class="${currentSection==='favorites'?'active':''}"><span class="ico">⭐</span><span>我的收藏</span></button>`;$('#sideManage').innerHTML=`<button data-nav="data" class="${currentSection==='data'?'active':''}"><span class="ico">⇅</span><span>数据管理</span></button>`;const mobile=[sections[0],sections[1],sections[2],sections[3],{id:'more',name:'更多',icon:'☰'}];$('#mobileNav').innerHTML=mobile.map(s=>`<button data-nav="${s.id}" class="${currentSection===s.id?'active':''}"><span class="ico">${s.icon}</span><span>${s.name}</span></button>`).join('')}
function resourceText(r){return [r.name,r.url,r.description,r.notes,r.tags,r.command,r.usage,r.parameters,r.example,r.path,r.system,r.environment,r.account,r.config,r.category].flat().join(' ').toLowerCase()}
function matches(r){if(currentSection==='favorites'&&!r.favorite)return false;if(currentSection!=='home'&&currentSection!=='favorites'&&currentSection!=='data'&&currentSection!=='more'&&r.section!==currentSection)return false;if(searchTerm&&!resourceText(r).includes(searchTerm.toLowerCase()))return false;if(activeFilter==='favorite'&&!r.favorite)return false;if(activeFilter!=='all'&&activeFilter!=='favorite'&&r.category!==activeFilter)return false;return true}
function categoriesFor(section){return [...new Set(resources.filter(r=>!section||r.section===section).map(r=>r.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'))}
function resourceIcon(r){if(r.section==='accounts')return '🔐';if(r.section==='files')return '📁';if(r.section==='tools')return r.command?'⌘':'🧰';if(r.section==='knowledge')return '📚';if(r.section==='platforms')return '🌐';if(r.section==='templates')return '📋';return '📌'}
function formatDate(d){if(!d)return '';try{return new Date(d).toLocaleDateString('zh-CN')}catch(e){return ''}}
function openTarget(r){const url=(r.url||'').trim();if(url){let u=url;if(!/^https?:\/\//i.test(u)&&!/^mailto:/i.test(u))u='https://'+u;window.open(u,'_blank','noopener');}else if(r.path){toast('文件路径已记录，可点击“复制路径”使用')}else if(r.command){showCommand(r)}else{showDetails(r)};if(!r.lastUsed)r.lastUsed=new Date().toISOString();r.lastUsed=new Date().toISOString();r.useCount=(r.useCount||0)+1;saveResource(r).catch(()=>{});}
function copyText(text){if(!text){toast('没有可复制的内容');return}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制到剪贴板')}catch(e){toast('复制失败，请手动选择复制')}ta.remove()}
function cardHtml(r){const sec=getSection(r.section);let detail=r.description||r.usage||r.config||r.notes||r.path||'';if(r.command)detail=r.command;return `<article class="card"><div class="card-top"><div class="card-icon">${resourceIcon(r)}</div><div style="min-width:0;flex:1"><div class="card-title">${esc(r.name||'未命名资源')}</div><div class="card-sub">${esc(sec.name)}${r.category?' · '+esc(r.category):''}</div></div><button class="star ${r.favorite?'on':''}" data-action="favorite" data-id="${r.id}" title="收藏">${r.favorite?'★':'☆'}</button></div>${detail?`<div class="card-desc">${esc(detail.length>190?detail.slice(0,190)+'…':detail)}</div>`:''}<div class="tags">${splitTags(r.tags).slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${r.environment?`<span class="tag">${esc(r.environment)}</span>`:''}</div><div class="card-actions">${r.url?`<button class="btn primary" data-action="open" data-id="${r.id}">↗ 打开</button>`:''}${r.path?`<button class="btn" data-action="copy-path" data-id="${r.id}">复制路径</button>`:''}${r.command?`<button class="btn" data-action="copy-command" data-id="${r.id}">复制命令</button>`:''}<button class="btn" data-action="details" data-id="${r.id}">详情</button><button class="btn" data-action="edit" data-id="${r.id}">编辑</button></div></article>`}
function tableHtml(rows){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>资源名称</th><th>分类</th><th>摘要 / 地址 / 路径</th><th>标签</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.favorite?'⭐ ':''}${esc(r.name)}<div class="muted">${esc(getSection(r.section).name)}</div></td><td>${esc(r.category||'—')}</td><td>${esc((r.description||r.usage||r.url||r.path||r.command||'').slice(0,140))}</td><td>${splitTags(r.tags).map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')}</td><td><div style="display:flex;gap:5px;flex-wrap:wrap">${r.url?`<button class="btn small primary" data-action="open" data-id="${r.id}">打开</button>`:''}<button class="btn small" data-action="details" data-id="${r.id}">详情</button><button class="btn small" data-action="edit" data-id="${r.id}">编辑</button></div></td></tr>`).join('')}</tbody></table></div>`}
function renderHome(){const all=resources;const recent=[...all].filter(r=>r.lastUsed).sort((a,b)=>(b.lastUsed||'').localeCompare(a.lastUsed||'')).slice(0,6);const fav=all.filter(r=>r.favorite).slice(0,6);const frequent=[...all].sort((a,b)=>(b.useCount||0)-(a.useCount||0)).slice(0,6);return `<div class="page-title"><div><h2>工作首页</h2><p>测试工程师的个人工作台，快速找到环境、命令、手册和经验。</p></div><button class="btn primary" data-action="add">＋ 新增资源</button></div><div class="search-wrap"><input id="globalSearch" value="${esc(searchTerm)}" placeholder="搜索环境、命令、操作手册、知识、工具……"><button class="btn primary" id="searchBtn">搜索</button></div><div class="stats"><div class="stat"><div class="label">资源总数</div><div class="num">${all.length}</div></div><div class="stat"><div class="label">账号与环境</div><div class="num">${all.filter(r=>r.section==='accounts').length}</div></div><div class="stat"><div class="label">工作工具</div><div class="num">${all.filter(r=>r.section==='tools').length}</div></div><div class="stat"><div class="label">我的收藏</div><div class="num">${all.filter(r=>r.favorite).length}</div></div></div>${searchTerm?`<div class="section-head"><h3>搜索结果</h3><span>${all.filter(matches).length} 条匹配</span></div>${renderListing(all.filter(matches))}`:`<div class="section-head"><h3>常用入口</h3><span>按使用次数排序</span></div>${frequent.length?`<div class="cards">${frequent.map(cardHtml).join('')}</div>`:`<div class="empty"><strong>欢迎使用个人工作资源中心</strong>可以先录入测试环境、常用命令或操作手册。<br><br><button class="btn primary" data-action="add">新增第一条资源</button>　<button class="btn" data-action="seed">加载示例数据</button></div>`}<div class="section-head"><h3>最近访问</h3><span>最近使用的资源</span></div>${recent.length?`<div class="cards">${recent.map(cardHtml).join('')}</div>`:`<div class="empty">暂时没有访问记录</div>`}<div class="section-head"><h3>我的收藏</h3><span>快速访问重要资源</span></div>${fav.length?`<div class="cards">${fav.map(cardHtml).join('')}</div>`:`<div class="empty">还没有收藏资源，点击资源卡片上的 ☆ 即可收藏。</div>`}`}
function renderListing(rows){if(!rows.length)return `<div class="empty"><strong>没有找到匹配的资源</strong>试试其他关键词，或新增一条资源。</div>`;const pageSize=20;const pages=Math.max(1,Math.ceil(rows.length/pageSize));currentPage=Math.min(currentPage,pages);const start=(currentPage-1)*pageSize;const pageRows=rows.slice(start,start+pageSize);return `${currentView==='table'?tableHtml(pageRows):`<div class="cards">${pageRows.map(cardHtml).join('')}</div>`}<div class="pager"><span>显示 ${start+1}–${Math.min(start+pageSize,rows.length)} 条，共 ${rows.length} 条</span><div class="pager-controls"><button class="btn small" data-action="page-prev" ${currentPage<=1?'disabled':''}>上一页</button><span style="padding:7px">${currentPage} / ${pages}</span><button class="btn small" data-action="page-next" ${currentPage>=pages?'disabled':''}>下一页</button></div></div>`}
function renderSectionPage(){const sec=getSection(currentSection);const rows=resources.filter(matches);const cats=categoriesFor(currentSection);return `<div class="page-title"><div><h2>${sec.icon} ${sec.name}</h2><p>${sec.desc}</p></div><button class="btn primary" data-action="add">＋ 新增</button></div><div class="filters"><input id="listSearch" placeholder="搜索名称、说明、标签……" value="${esc(searchTerm)}"><select id="categoryFilter"><option value="all">全部分类</option>${cats.map(c=>`<option ${activeFilter===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}<option value="favorite" ${activeFilter==='favorite'?'selected':''}>仅看收藏</option></select><select id="viewSelect"><option value="card" ${currentView==='card'?'selected':''}>卡片视图</option><option value="table" ${currentView==='table'?'selected':''}>列表视图</option></select><button class="btn" data-action="clear-filter">重置</button></div>${renderListing(rows)}`}
function renderFavorites(){const rows=resources.filter(r=>r.favorite&&(!searchTerm||resourceText(r).includes(searchTerm.toLowerCase())));return `<div class="page-title"><div><h2>⭐ 我的收藏</h2><p>跨板块集中查看收藏的环境、命令、知识和资源。</p></div></div><div class="filters"><input id="listSearch" placeholder="搜索收藏资源……" value="${esc(searchTerm)}"><select id="viewSelect"><option value="card" ${currentView==='card'?'selected':''}>卡片视图</option><option value="table" ${currentView==='table'?'selected':''}>列表视图</option></select></div>${renderListing(rows)}`}
function renderData(){return `<div class="page-title"><div><h2>数据管理</h2><p>数据保存在当前浏览器的本地数据库中；建议定期导出备份。</p></div></div><div class="notice"><strong>本地存储提示：</strong>同一网址下的浏览器数据会持续保存，但不同设备/浏览器不会自动同步。清理网站数据可能导致记录丢失。GitHub Pages 只托管网页代码，不会自动保存你录入的资源。</div><div class="stats"><div class="stat"><div class="label">资源总数</div><div class="num">${resources.length}</div></div><div class="stat"><div class="label">已分类板块</div><div class="num">${new Set(resources.map(r=>r.section)).size}</div></div><div class="stat"><div class="label">收藏资源</div><div class="num">${resources.filter(r=>r.favorite).length}</div></div><div class="stat"><div class="label">备份建议</div><div class="num" style="font-size:18px">定期导出</div></div></div><div class="cards"><div class="card"><div class="card-icon">⬇️</div><div class="card-title">导出 JSON 备份</div><div class="card-desc">备份全部资源、分类字段、标签、收藏和访问记录。建议定期保存到安全位置。</div><button class="btn primary" data-action="export-json">导出完整备份</button></div><div class="card"><div class="card-icon">⬆️</div><div class="card-title">导入 JSON 备份</div><div class="card-desc">从之前导出的备份恢复数据。可以选择合并导入或覆盖当前数据。</div><button class="btn" data-action="import-json">选择备份文件</button></div><div class="card"><div class="card-icon">📄</div><div class="card-title">CSV 批量导入 / 导出</div><div class="card-desc">支持用表格软件编辑 CSV 资源清单。导入时可映射到对应板块。</div><button class="btn" data-action="export-csv">导出 CSV 清单</button> <button class="btn" data-action="template-csv">下载 CSV 模板</button><button class="btn" data-action="import-csv">导入 CSV</button></div><div class="card"><div class="card-icon">🧹</div><div class="card-title">清空本地数据</div><div class="card-desc">删除当前浏览器中本项目保存的全部资源。执行前请先导出备份。</div><button class="btn danger" data-action="clear-all">清空数据</button></div></div><div class="section-head"><h3>数据使用说明</h3></div><div class="card"><ul style="padding-left:20px;margin:0;color:#475467"><li>建议每次批量修改前后都导出 JSON 备份。</li><li>更换设备或浏览器时，在新设备打开同一个部署网址后导入 JSON 文件。</li><li>升级网页代码时，不要更换数据库名称；当前版本使用 IndexedDB 保存资源。</li><li>本版支持 CSV 批量导入/导出；可用 Excel 打开和编辑 CSV 文件。后续可根据实际需求增加原生 XLSX 支持。</li><li>本地文件仅记录路径，不会自动上传或同步文件本身。</li></ul></div>`}
function renderMore(){return `<div class="page-title"><div><h2>更多</h2><p>其他资源板块与管理入口</p></div></div><div class="cards">${[sections[4],sections[5],sections[6],{id:'favorites',name:'我的收藏',icon:'⭐',desc:'查看所有已收藏资源'},{id:'data',name:'数据管理',icon:'⇅',desc:'导入、导出、备份和恢复'}].map(s=>`<button class="card" style="text-align:left;border:1px solid var(--line)" data-nav="${s.id}"><div class="card-top"><div class="card-icon">${s.icon}</div><div><div class="card-title">${s.name}</div><div class="card-sub">${s.desc||''}</div></div></div></button>`).join('')}</div>`}
function render(){renderNav();const c=$('#content');if(currentSection==='home')c.innerHTML=renderHome();else if(currentSection==='data')c.innerHTML=renderData();else if(currentSection==='favorites')c.innerHTML=renderFavorites();else if(currentSection==='more')c.innerHTML=renderMore();else c.innerHTML=renderSectionPage()}
function showModal(title,body,buttons){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=buttons;$('#modalBackdrop').classList.add('show')}
function closeModal(){$('#modalBackdrop').classList.remove('show');editId=null}
function field(label,name,value='',type='text',full=false,placeholder=''){return `<div class="field ${full?'full':''}"><label for="f_${name}">${label}</label>${type==='textarea'?`<textarea id="f_${name}" name="${name}" placeholder="${esc(placeholder)}">${esc(value||'')}</textarea>`:`<input id="f_${name}" name="${name}" type="${type}" value="${esc(value||'')}" placeholder="${esc(placeholder)}">`}</div>`}
function selectField(label,name,options,value='',full=false){return `<div class="field ${full?'full':''}"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(o=>`<option value="${esc(o.value)}" ${o.value===value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`}
function openResourceForm(id=null,defaultSection=null){editId=id;const r=id?resources.find(x=>x.id===id):{section:defaultSection||(['home','favorites','data','more'].includes(currentSection)?'accounts':currentSection),tags:[],favorite:false};const secOpts=sections.filter(s=>s.id!=='home').map(s=>({value:s.id,label:s.name}));const section=r.section||'accounts';let specific='';
if(section==='accounts'){specific=field('环境名称','environment',r.environment)+field('账号标识（可选）','account',r.account)+field('关联手册/文档链接','manualUrl',r.manualUrl,'url',true)+field('配置说明','config',r.config,'textarea',true,'连接方式、网络要求、注意事项')}
if(section==='files'){specific=field('本地文件/文件夹路径','path',r.path,'text',true,'例如：D:\\\\测试资料\\\\用例.xlsx')+field('设备/系统备注','device',r.device)+field('文件类型','fileType',r.fileType)}
if(section==='tools'){specific=field('工具地址','url',r.url,'url',true,'https://…')+field('命令内容','command',r.command,'textarea',true,'可粘贴常用操作命令')+field('使用场景','usage',r.usage,'textarea',true)+field('参数说明','parameters',r.parameters,'textarea',true)+field('示例','example',r.example,'textarea',true)}
if(section==='knowledge'){specific=field('知识正文 / 操作步骤','body',r.body,'textarea',true,'支持记录操作手册、业务规则、问题分析等')+field('关联系统','system',r.system)+field('关联文档链接','manualUrl',r.manualUrl,'url',true)}
if(section==='platforms'){specific=field('平台地址','url',r.url,'url',true,'https://…')+field('平台用途','usage',r.usage,'textarea',true)}
if(section==='templates'){specific=field('模板文件路径或下载链接','url',r.url,'url',true,'https://… 或可访问的文件链接')+field('本地文件路径（可选）','path',r.path,'text',true)+field('使用说明','usage',r.usage,'textarea',true)}
const body=`<form id="resourceForm"><div class="form-grid">${field('资源名称 *','name',r.name||'')}${selectField('所属板块','section',secOpts,section)}${field('分类','category',r.category||'')}${field('标签（逗号分隔）','tags',splitTags(r.tags).join(', '))}${field('访问地址（可选）','url',r.url,'url',true,'https://…')}${field('用途说明 / 摘要','description',r.description,'textarea',true,'简要说明这条资源的用途')}${specific}${field('备注','notes',r.notes,'textarea',true)}<div class="field full"><label><input type="checkbox" id="f_favorite" ${r.favorite?'checked':''} style="width:auto"> 加入我的收藏</label></div></div></form>`;
showModal(id?'编辑资源':'新增资源',body,`<button class="btn" id="cancelForm">取消</button><button class="btn primary" id="saveForm">保存资源</button>`);$('#cancelForm').onclick=closeModal;$('#saveForm').onclick=async()=>{const form=$('#resourceForm');const fd=new FormData(form);const data=Object.fromEntries(fd.entries());if(!data.name.trim()){toast('请填写资源名称');$('#f_name').focus();return}const old=id?resources.find(x=>x.id===id):{};const item={...old,...data,id:id||uid(),section:data.section||section,tags:splitTags(data.tags),favorite:$('#f_favorite').checked,createdAt:old.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(item.section==='home')item.section='accounts';await saveResource(item);closeModal();currentSection=item.section;searchTerm='';activeFilter='all';currentPage=1;render();toast(id?'资源已更新':'资源已保存')};$('#f_name').focus();$('#f_section').onchange=()=>{toast('更换板块后请保存；若需填写新板块专属字段，建议先保存后再编辑一次')}}
function showDetails(r){const rows=[['所属板块',getSection(r.section).name],['分类',r.category],['访问地址',r.url],['环境名称',r.environment],['账号标识',r.account],['本地路径',r.path],['设备备注',r.device],['工具命令',r.command],['使用场景',r.usage],['参数说明',r.parameters],['示例',r.example],['业务正文',r.body],['配置说明',r.config],['用途说明',r.description],['标签',splitTags(r.tags).join('、')],['备注',r.notes],['创建时间',formatDate(r.createdAt)],['更新时间',formatDate(r.updatedAt)]].filter(x=>x[1]);showModal(r.name,`<div class="form-grid">${rows.map(([k,v])=>`<div class="field ${String(v).length>90?'full':''}"><label>${esc(k)}</label><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(v)}</div></div>`).join('')}</div>${r.command?`<div class="section-head"><h3>命令</h3><button class="btn small" data-action="copy-command" data-id="${r.id}">复制命令</button></div><div class="code">${esc(r.command)}</div>`:''}`,`<button class="btn" id="detailClose">关闭</button><button class="btn primary" id="detailEdit">编辑</button>`);$('#detailClose').onclick=closeModal;$('#detailEdit').onclick=()=>{closeModal();openResourceForm(r.id)}}
function showCommand(r){showModal(r.name,`<div class="field"><label>命令内容</label><div class="code">${esc(r.command||'')}</div></div>${r.usage?`<p>${esc(r.usage)}</p>`:''}`,`<button class="btn" id="commandClose">关闭</button><button class="btn primary" id="commandCopy">复制命令</button>`);$('#commandClose').onclick=closeModal;$('#commandCopy').onclick=()=>copyText(r.command)}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){const payload={app:'个人工作资源中心',version:1,exportedAt:new Date().toISOString(),resources};downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),`工作资源备份_${new Date().toISOString().slice(0,10)}.json`);toast('JSON 备份已导出')}
function csvEscape(v){let s=Array.isArray(v)?v.join('|'):String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
const csvFields=['name','section','category','url','description','tags','favorite','environment','account','config','path','device','fileType','command','usage','parameters','example','body','system','manualUrl','notes'];
function exportCSV(){const csv='\uFEFF'+[csvFields.join(','),...resources.map(r=>csvFields.map(k=>csvEscape(r[k])).join(','))].join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`工作资源清单_${new Date().toISOString().slice(0,10)}.csv`);toast('CSV 清单已导出')}
function templateCSV(){const sample={name:'示例：Linux 查看进程',section:'tools',category:'Linux命令',url:'',description:'查看进程信息',tags:'Linux|命令|排查',favorite:'false',environment:'',account:'',config:'',path:'',device:'',fileType:'',command:'ps -ef | grep nginx',usage:'排查服务进程',parameters:'-ef：显示全部进程',example:'ps -ef | grep nginx',body:'',system:'',manualUrl:'',notes:''};const csv='\uFEFF'+csvFields.join(',')+'\r\n'+csvFields.map(k=>csvEscape(sample[k])).join(',');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'工作资源导入模板.csv')}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(quoted){if(c==='"'&&n==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else{if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field);rows.push(row);row=[];field=''}else if(c!=='\r')field+=c}}if(field.length||row.length){row.push(field);rows.push(row)}return rows}
function importFile(mode){const input=$('#importFile');input.value='';input.accept=mode==='json'?'.json,application/json':'.csv,text/csv';input.onchange=async()=>{const file=input.files[0];if(!file)return;const text=await file.text();if(mode==='json'){try{const obj=JSON.parse(text);const arr=Array.isArray(obj)?obj:obj.resources;if(!Array.isArray(arr))throw new Error('备份文件中没有 resources 数组');showModal('导入 JSON 备份',`<p>发现 <strong>${arr.length}</strong> 条资源。请选择导入方式：</p><div class="notice">合并：保留当前数据，按资源 ID 更新同 ID 记录。<br>覆盖：先清空当前资源，再导入备份。</div>`,`<button class="btn" id="impCancel">取消</button><button class="btn" id="impMerge">合并导入</button><button class="btn primary" id="impReplace">覆盖当前数据</button>`);$('#impCancel').onclick=closeModal;$('#impMerge').onclick=()=>applyImport(arr,false);$('#impReplace').onclick=()=>{if(confirm('确定覆盖当前全部资源？建议先导出当前备份。'))applyImport(arr,true)}}catch(e){toast('JSON 文件无法读取：'+e.message)}}else{try{const rows=parseCSV(text);if(rows.length<2)throw new Error('没有可导入的数据行');const heads=rows[0].map(x=>x.trim());const arr=rows.slice(1).filter(row=>row.some(x=>x.trim())).map(row=>{const r={};heads.forEach((h,i)=>r[h]=row[i]||'');return r});showModal('导入 CSV 清单',`<p>发现 <strong>${arr.length}</strong> 条资源记录。</p><div class="notice">CSV 导入将新增资源，不会删除现有数据。section 可填写：accounts、files、tools、knowledge、platforms、templates。</div>`,`<button class="btn" id="csvCancel">取消</button><button class="btn primary" id="csvConfirm">导入资源</button>`);$('#csvCancel').onclick=closeModal;$('#csvConfirm').onclick=async()=>{let count=0;for(const raw of arr){const sec=sections.some(s=>s.id===raw.section&&s.id!=='home')?raw.section:'tools';const r={...raw,id:uid(),section:sec,tags:splitTags(raw.tags),favorite:String(raw.favorite).toLowerCase()==='true',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};await saveResource(r);count++}closeModal();render();toast(`已导入 ${count} 条资源`)}}catch(e){toast('CSV 文件无法读取：'+e.message)}}};input.click()}
async function applyImport(arr,replace){try{if(replace){const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();await txDone(tx)}for(const raw of arr){if(!raw||!raw.name)continue;const section=sections.some(s=>s.id===raw.section&&s.id!=='home')?raw.section:'tools';const r={...raw,id:raw.id||uid(),section,tags:splitTags(raw.tags),favorite:!!raw.favorite,createdAt:raw.createdAt||new Date().toISOString(),updatedAt:raw.updatedAt||new Date().toISOString()};await saveResource(r)}closeModal();await loadAll();currentSection='home';render();toast(`已导入 ${arr.length} 条资源`)}catch(e){toast('导入失败：'+e.message)}}

];for(const s of samples)await saveResource({...s,id:uid(),createdAt:now,updatedAt:now});render();toast('已加载 6 条示例资源，请编辑替换')}
function handleAction(action,id){const r=resources.find(x=>x.id===id);switch(action){case'add':openResourceForm();break;case'edit':if(r)openResourceForm(id);break;case'details':if(r)showDetails(r);break;case'favorite':if(r){r.favorite=!r.favorite;r.updatedAt=new Date().toISOString();saveResource(r).then(render);toast(r.favorite?'已加入收藏':'已取消收藏')}break;case'open':if(r)openTarget(r);break;case'copy-path':if(r)copyText(r.path);break;case'copy-command':if(r)copyText(r.command);break;case'page-prev':currentPage=Math.max(1,currentPage-1);render();break;case'page-next':currentPage++;render();break;case'clear-filter':searchTerm='';activeFilter='all';currentPage=1;render();break;case'export-json':exportJSON();break;case'export-csv':exportCSV();break;case'template-csv':templateCSV();break;case'import-json':importFile('json');break;case'import-csv':importFile('csv');break;case'clear-all':if(confirm('确定清空当前浏览器中的全部资源？此操作无法撤销，建议先导出 JSON 备份。')){const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();txDone(tx).then(loadAll).then(()=>{render();toast('本地资源已清空')})}break;case'seed':seedSamples();break}}
function navigate(id){if(id==='more'){currentSection='more'}else currentSection=id;searchTerm='';activeFilter='all';currentPage=1;render()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const a=e.target.closest('[data-action]');if(a){handleAction(a.dataset.action,a.dataset.id);return}});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'||e.target.id==='listSearch'){searchTerm=e.target.value;currentPage=1;}});
document.addEventListener('change',e=>{if(e.target.id==='categoryFilter'){activeFilter=e.target.value;currentPage=1;render()}if(e.target.id==='viewSelect'){currentView=e.target.value;settings.view=currentView;persistSettings();render()}if(e.target.id==='listSearch'){searchTerm=e.target.value;currentPage=1;render()}});
$('#content').addEventListener('keydown',e=>{if((e.target.id==='globalSearch'||e.target.id==='listSearch')&&e.key==='Enter'){searchTerm=e.target.value;render()}});
document.addEventListener('click',e=>{if(e.target.id==='searchBtn'){searchTerm=$('#globalSearch')?.value||'';currentSection='home';render()}});
$('#quickAdd').onclick=()=>openResourceForm();$('#dataManage').onclick=()=>navigate('data');$('#closeModal').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
async function init(){try{loadSettings();db=await openDB();await loadAll();render()}catch(e){$('#content').innerHTML=`<div class="empty"><strong>初始化失败</strong>浏览器无法打开本地数据库。请使用最新版 Chrome、Edge 或 Safari，并确保网页通过 HTTPS 或 localhost 访问。<br><br><button class="btn" onclick="location.reload()">重新加载</button><p class="muted">${esc(e.message||e)}</p></div>`}}
init();
